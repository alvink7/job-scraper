# =============================================================================
# JOBWATCH config — everything tunable lives here. No code edits to retune.
# =============================================================================
#
# Candidate profile driving this config:
#   PRIMARY:   autonomy / robotics / sensors (lidar, radar, perception, fusion)
#   SECONDARY: firmware / embedded  AND  computer architecture / silicon
#   Stage:     intern / new-grad, US / Bay Area / Remote
#
# Company confidence tags in comments:
#   (confirmed) = slug verified against a live ATS URL pattern
#   (VERIFY)    = best guess; the run log prints per-company job counts, so a
#                 wrong slug shows as "0 jobs" or an error — fix it here.
#   [DEFENSE]   = defense / national-security company. Also set `defense: true`
#                 so the run log flags it. Remove any you don't want to track.
# =============================================================================

store:
  db_path: seen.db

matching:
  title_multiplier: 2.0
  body_cap_per_category: 3
  min_score: 10            # >= this = strong; >0 and < this = partial (still sent)
  weights: { core: 5, strong: 3, supporting: 1, negative: -2 }

gates:
  career_stage: intern_only           # intern_only | intern_or_newgrad | any
  max_years: 3                        # a role wanting N+ years (N>=this) fails
  # Optional override of the internship signal terms for intern_only mode:
  # intern_terms: [intern, internship, "co-op", coop]
  season: summer                      # summer | any. "summer" drops titles that
                                      # name a different season; keeps "summer …"
                                      # and season-unspecified intern titles.
  exclude_seasons: [fall, autumn, winter, spring]
  exclude_title:
    # --- seniority ---
    - senior
    - staff
    - principal
    - lead
    - manager
    - director
    - "sr."
    - "sr"
    - "vp"
    - "head of"
    - fellow
    - "ii"
    - "iii"
    - "iv"
    - architect
    - distinguished
    - expert
    # --- ML / data-science roles (out of scope: hardware/firmware/AV only) ---
    - machine learning
    - deep learning
    - "ml engineer"
    - data scientist
    - data science
    - nlp
    - llm
    - generative ai
    - research scientist
    # --- non-EE/CS engineering disciplines (must be electrical/computer) ---
    - mechanical
    - civil
    - structural
    - chemical
    - materials
    - biomedical
    - environmental
    - thermal
    - propulsion
    - aerodynamics
    - "industrial engineer"
    - manufacturing
    # --- non-engineering roles (must be an engineering role) ---
    - management       # Product/Program Management ( "manager" already excluded )
    - marketing
    - recruiting
    - operations
  # Location allowlist. Substring match against location (or body if location is
  # empty). Empty list [] disables the gate.
  # Scope: US — NYC + California (Bay Area, LA/OC, San Diego) + Remote.
  location_any:
    # --- Remote (US) ---
    - remote
    # --- New York City ---
    - new york
    - nyc
    - manhattan
    - brooklyn
    - long island city
    # --- California Bay Area ---
    - san francisco
    - bay area
    - mountain view
    - palo alto
    - sunnyvale
    - santa clara
    - san jose
    - fremont
    - foster city
    - redwood city
    - menlo park
    - cupertino
    - berkeley
    - oakland
    - emeryville
    - south san francisco
    - san mateo
    - milpitas
    - hayward
    - alameda
    - pleasanton
    - san bruno
    - burlingame
    - san carlos
    - campbell
    - los gatos
    - newark, ca
    # --- California LA / Orange County area ---
    - los angeles
    - santa monica
    - el segundo
    - pasadena
    - long beach
    - torrance
    - culver city
    - burbank
    - glendale
    - hawthorne
    - playa vista
    - marina del rey
    - irvine
    - costa mesa
    - anaheim
    # --- California San Diego ---
    - san diego
  min_domain_score: 3

# =============================================================================
# ROUTING — send each match to a Discord channel by topic. Classification is
# deterministic: every canonical keyword below is owned by exactly one channel;
# a job routes to the channel with the highest title-weighted keyword score
# (title hits decide first; body breaks the rest; ties use `priority` order).
# Each channel reads its webhook from an env var / GitHub secret. If that var is
# unset, it falls back to DISCORD_WEBHOOK_URL.
# =============================================================================
routes:
  default: software_and_firmware      # used only if a job owns no routed term
  priority: [autonomous_driving, hardware, software_and_firmware]  # tie-break
  channels:

    autonomous_driving:               # "autonomous driving systems engineering"
      webhook_env: DISCORD_WEBHOOK_AUTONOMY
      terms:
        - lidar
        - radar
        - point cloud
        - sensor fusion
        - perception
        - sensor systems
        - point cloud registration
        - slam
        - calibration
        - camera-lidar
        - autonomous vehicle
        - robotics
        - motion planning
        - depth estimation
        - occupancy
        - state estimation
        - control systems
        - computer vision
        - ros
        - open3d
        - jetson
        - cuda

    hardware:                         # silicon, EE, RF, sensor hardware, PCB
      webhook_env: DISCORD_WEBHOOK_HARDWARE
      terms:
        - rtl
        - verilog
        - fpga
        - asic
        - computer architecture
        - design verification
        - digital design
        - physical design
        - analog design
        - power electronics
        - battery management
        - rf design
        - soc integration
        - high-speed io
        - hardware validation
        - sensors hardware
        - semiconductor
        - pcb
        - signal integrity
        - oscilloscope
        - dsp

    software_and_firmware:            # firmware / embedded + general software
      webhook_env: DISCORD_WEBHOOK_SWFW
      terms:
        - firmware
        - embedded
        - rtos
        - microcontroller
        - device drivers
        - board bring-up
        - can bus
        - motor control
        - i2c/spi/uart
        - c++
        - c language
        - python
        - matlab
        - linux
        - git
        - real-time
        - benchmarking

# =============================================================================
# KEYWORDS — grouped by category. Weights come from matching.weights above.
# Add/remove terms freely; add a new category by also adding its weight.
# =============================================================================
keywords:

  # --------------------------------------------------------------------- #
  # CORE (weight 5) — bullseye domain terms
  # --------------------------------------------------------------------- #
  core:
    lidar: [lidar, li-dar, laser scanning, laser scanner, time-of-flight, "time of flight"]
    radar: [radar, fmcw, mimo radar, range-doppler, "range doppler", millimeter wave, mmwave]
    point cloud: [point cloud, point-cloud, pointcloud, point clouds]
    sensor fusion: [sensor fusion, multi-sensor fusion, multi sensor fusion, multimodal fusion]
    perception: [perception, perception stack, perception pipeline, scene understanding]
    sensor systems: [sensor systems, sensor system, sensing systems, sensing hardware]
    point cloud registration: [scan registration, icp, global registration, point cloud registration]
    slam: [slam, "localization and mapping", "simultaneous localization", visual odometry, vio]
    calibration: [sensor calibration, extrinsic calibration, intrinsic calibration, camera-lidar calibration]
    camera-lidar: [camera-lidar, camera lidar, lidar-camera, projection onto image]
    autonomous vehicle: [autonomous vehicle, self-driving, self driving, autonomy, av stack, adas, autonomous driving, driverless]
    robotics: [robotics, robot perception, mobile robot, autonomous robot, robotic system]
    motion planning: [motion planning, path planning, trajectory optimization, trajectory planning]
    depth estimation: [depth estimation, stereo vision, structure from motion, "structure-from-motion"]
    occupancy: [occupancy grid, occupancy network, bird's eye view, "birds eye view", bev perception]

  # --------------------------------------------------------------------- #
  # STRONG (weight 3) — strongly-relevant skills
  # --------------------------------------------------------------------- #
  strong:
    # compute / robotics / systems (GPU compute for perception — NOT ML modeling)
    cuda: [cuda, gpu kernel, gpu compute, nvdec, cuda kernel, gpu acceleration]
    jetson: [jetson, orin, jetson orin, drive agx, jetson orin nano]
    ros: [ros, ros2, "ros 2", robot operating system]
    open3d: [open3d, pcl, point cloud library]
    computer vision: [computer vision, opencv, 3d geometry, 3d computational geometry, image processing, rigid transform]
    dsp: [dsp, digital signal processing, signal processing, fft, range-doppler map, butterworth, peak detection, digital filter, filter design]
    state estimation: [state estimation, kalman, kalman filter, ekf, bayesian filtering, particle filter, factor graph]
    control systems: [control systems, control theory, model predictive control, mpc, feedback control, pid, pid controller]
    # firmware / embedded
    firmware: [firmware, firmware development, firmware engineer, embedded firmware]
    embedded: [embedded, embedded systems, embedded software, embedded linux, embedded c, embedded development, yocto, buildroot, petalinux, u-boot, device tree, board support package, bsp, linux kernel, kernel driver]
    rtos: [rtos, freertos, zephyr, real-time operating system, esp-idf, task notification, threadx, mbed]
    microcontroller: [microcontroller, mcu, stm32, esp32, esp32-s2, arm cortex, cortex-m, raspberry pi, compute module, cm4, msp430, nrf52, nordic, risc-v]
    device drivers: [device driver, device drivers, driver development, bootloader, dma, interrupt, isr, hal, register-level, secure boot, ota update]
    can bus: [can bus, canbus, controller area network, canopen, ecu, vehicle bus, lin bus, automotive ethernet]
    board bring-up: [board bring-up, board bringup, bring-up, hardware bring-up, board validation]
    motor control: [motor control, bldc, field-oriented control, foc, motor driver, encoder, inverter]
    # computer architecture / digital design / silicon
    rtl: [rtl, rtl design, register transfer level, lint, clock domain crossing, cdc]
    verilog: [verilog, systemverilog, system verilog, vhdl, chisel]
    fpga: [fpga, fpga design, vivado, quartus, vitis, hls, high-level synthesis, xilinx, altera]
    asic: [asic, soc, system-on-chip, vlsi, tapeout, tape-out, netlist]
    computer architecture: [computer architecture, microarchitecture, micro-architecture, cpu architecture, gpu architecture, accelerator design, cache coherence, memory hierarchy, pipelining]
    design verification: [design verification, uvm, functional verification, testbench, formal verification, assertion, sva, code coverage, emulation, hardware verification]
    digital design: [digital design, logic design, asic design, rtl coding, synthesizable]
    physical design: [physical design, place and route, place-and-route, logic synthesis, timing closure, static timing analysis, floorplanning, clock tree, drc, lvs, parasitic extraction, ppa, innovus, primetime]
    analog design: [analog design, mixed-signal, mixed signal, analog ic, analog circuit, analog front end, afe, "ams design", cadence virtuoso, spice, spectre]
    power electronics: [power electronics, power management, pmic, dc-dc, buck converter, boost converter, power supply, smps, power delivery, power integrity]
    battery management: [battery management, "bms", battery management system, cell balancing, battery pack, state of charge]
    rf design: [rf design, rf engineer, radio frequency, antenna design, transceiver, phased array, s-parameters, "rf front end", wireless hardware]
    soc integration: [soc integration, network-on-chip, "noc", axi, amba, chiplet, ucie, die-to-die, interconnect]
    high-speed io: [serdes, high-speed serial, high speed serial, pcie, ddr, hbm, memory controller, ethernet phy]
    hardware validation: [post-silicon validation, silicon bring-up, hardware validation, system validation, bench validation, characterization, dft, design for test, scan chain, ate]
    sensors hardware: [mems, imu, accelerometer, gyroscope, magnetometer, adc, dac, data converter, sensor interface, capacitive sensing]
    semiconductor: [semiconductor, process integration, wafer, fabrication, failure analysis, device physics, tcad, yield, reliability engineering, semiconductor test]

  # --------------------------------------------------------------------- #
  # SUPPORTING (weight 1) — generic-but-relevant
  # --------------------------------------------------------------------- #
  supporting:
    c++: [c++, cpp, c/c++]
    c language: [embedded c, c programming, bare-metal, baremetal]   # never a lone "c"
    python: [python, numpy, scipy]
    matlab: [matlab, simulink]
    pcb: [pcb, pcb design, pcb layout, altium, altium designer, kicad, schematic capture, mixed-signal, gerber, layout]
    signal integrity: [signal integrity, controlled impedance, high-speed, emc, termination, impedance matching, reflection]
    i2c/spi/uart: [i2c, spi, uart, usart, usb]
    oscilloscope: [oscilloscope, logic analyzer, jtag, debugger, multimeter, bench testing]
    benchmarking: [benchmarking, profiling, roofline, performance optimization, latency, throughput, arithmetic intensity]
    linux: [linux, unix, posix]
    git: [git, github, version control, ci/cd]
    real-time: [real-time, real time, low-latency, deterministic]

  # --------------------------------------------------------------------- #
  # NEGATIVE (weight -2) — body-only, capped; pushes down mismatched roles.
  # Keep conservative; the hard gates do the heavy lifting.
  # --------------------------------------------------------------------- #
  negative:
    sales: [pure sales, account executive, quota]
    recruiting: [recruiter, talent acquisition, sourcer]
    marketing: [marketing campaign, brand marketing, social media]
    finance: [financial analyst, accountant, bookkeeping]
    ops: [warehouse associate, forklift, order picking]

