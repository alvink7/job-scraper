name: jobwatch
# Keyword-only ATS job watcher — posts routed matches to Discord.

on:
  schedule:
    # Every 15 minutes (~96 runs/day). Requires a PUBLIC repo for unlimited
    # Actions minutes; on a private repo this would exhaust the free 2,000
    # min/month in a few days. GitHub may delay/skip some ticks under load.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - seed
          - dry-run

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run jobwatch
        env:
          # One webhook per Discord channel. DISCORD_WEBHOOK_URL is an optional
          # fallback used for any route whose specific secret is unset.
          DISCORD_WEBHOOK_AUTONOMY: ${{ secrets.DISCORD_WEBHOOK_AUTONOMY }}
          DISCORD_WEBHOOK_HARDWARE: ${{ secrets.DISCORD_WEBHOOK_HARDWARE }}
          DISCORD_WEBHOOK_SWFW: ${{ secrets.DISCORD_WEBHOOK_SWFW }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "seed" ]; then
            python main.py --seed
          elif [ "$MODE" = "dry-run" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Commit seen.db
        if: ${{ github.event.inputs.mode != 'dry-run' }}
        run: |
          git config user.name  "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add seen.db
          if git diff --staged --quiet; then
            echo "No DB changes to commit."
            exit 0
          fi
          git commit -m "chore: update seen.db [skip ci]"
          # seen.db is a binary SQLite file that can't be 3-way merged, so a
          # concurrent run's DB commit makes a plain rebase conflict (this is
          # what previously exited 128). On a rejected push we rebase our single
          # commit onto origin and keep OUR db (-X ours); worst case a job that
          # the other run marked seen re-notifies once. Retry a few times for
          # transient races, and never leave a half-finished rebase behind.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed seen.db on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/master."
            git fetch origin master
            git rebase -X ours origin/master || git rebase --abort
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push seen.db after 5 attempts." >&2
          exit 1
